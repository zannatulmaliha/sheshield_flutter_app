<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SheShield — Verify Code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
.ss-otp{width:44px;height:54px;border-radius:12px;background:#3D2740;border:1px solid rgba(255,255,255,0.1);color:#FBF4F5;text-align:center;font-size:20px;font-weight:700;font-family:inherit;}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2A1B2D; color: #FBF4F5; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; padding: 22px 26px 0;">

    <a href="Login.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 50%; background: #3D2740; display: flex; align-items: center; justify-content: center; color: #FBF4F5; text-decoration: none; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>

    <div style="margin-top: 30px; display: inline-flex; align-self: flex-start; background: rgba(201,123,132,0.15); color: #C97B84; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; padding: 5px 11px; border-radius: 999px;">STEP 1 OF 2</div>

    <div style="margin-top: 14px;">
      <div style="font-size: 25px; font-weight: 800;">Verify your number</div>
      <div style="font-size: 13.5px; color: #B7969E; margin-top: 8px; line-height: 1.5;">Enter the 6-digit code sent to +880 1XXX-XXXXXX</div>
    </div>

    <fieldset style="margin: 32px 0 0; border: none; padding: 0; display: flex; gap: 9px;">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);">Verification code</legend>
      <input class="ss-otp" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1">
      <input class="ss-otp" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2">
      <input class="ss-otp" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3">
      <input class="ss-otp" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4">
      <input class="ss-otp" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5">
      <input class="ss-otp" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6">
    </fieldset>

    <div style="margin-top: 20px; font-size: 12.5px; color: #B7969E;">
      Didn't get a code?
      <button type="button" style="background: none; border: none; padding: 0; color: #C97B84; font-weight: 700; font-size: 12.5px; font-family: inherit; cursor: pointer;">Resend</button>
    </div>

    <a href="CreatePIN.dc.html" style="margin-top: 28px; width: 100%; box-sizing: border-box; height: 54px; border-radius: 14px; background: #C97B84; color: #2A1B2D; font-size: 15.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none;">Verify &amp; Continue</a>

  </div>

  <div style="flex-shrink: 0; height: 40px;"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
