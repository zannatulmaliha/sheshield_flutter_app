        <span style="font-size: 30px; font-weight: 800; letter-spacing: 0.03em;">SOS</span>

    </div>

    <div style="padding: 28px 22px 24px; display: flex; flex-direction: column; gap: 14px;">

          <span style="font-size: 13.5px; font-weight: 600;">Fake Call</span>
        </button>

        <button type="button" class="ss-card" style="border: 1px solid rgba(255,255,255,0.08); width: 100%;">
          <span class="ss-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></span>
          <span style="font-size: 13.5px; font-weight: 600;">Record Evidence</span>

          <span style="font-size: 13.5px; font-weight: 600;">Track My Route</span>
        </a>

        <button type="button" class="ss-card" style="border: 1px solid rgba(255,255,255,0.08); width: 100%;">
          <span class="ss-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
          <span style="font-size: 13.5px; font-weight: 600;">Community Alerts</span>
        </button>

    </div>

    <a href="Main.dc.html" class="ss-nav-item" style="color: #C97B84;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

    <a href="Contacts.dc.html" class="ss-nav-item" style="color: #B7969E;">

    </a>
    <a href="Profile.dc.html" class="ss-nav-item" style="color: #B7969E;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Profile</span>
    </a>
  </div>
</div>
