<html lang="en">

<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
.ss-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;padding-top:8px;}
.ss-label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B7969E;padding:0 4px 8px;}
.ss-report{background:#3D2740;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#FBF4F5;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;}
.ss-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:none;width:100%;box-sizing:border-box;font-family:inherit;text-align:left;color:inherit;cursor:pointer;}
.ss-row-icon{width:34px;height:34px;border-radius:9px;background:#2A1B2D;color:#C97B84;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ss-divider{height:1px;background:rgba(255,255,255,0.07);margin:0 16px;}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2A1B2D; color: #FBF4F5; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex-shrink: 0; padding: 24px 22px 0;">
    <div style="font-size: 22px; font-weight: 800;">Safety</div>
    <div style="font-size: 12px; color: #B7969E; margin-top: 3px;">Your safety comes first on every response.</div>
  </div>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 16px 22px 22px; display: flex; flex-direction: column; gap: 20px;">

    <div style="background: #3D1E22; border: 1px solid rgba(255,90,95,0.35); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px;">
      <span style="width: 46px; height: 46px; border-radius: 50%; background: #FF5A5F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </span>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 14.5px; font-weight: 800; color: #FF9EA1;">Emergency hotline</div>
        <div style="font-size: 11.5px; color: #D9AEB2; margin-top: 2px;">If a situation turns dangerous</div>
      </div>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 12px; background: #FF5A5F; border: none; color: #FFFFFF; font-family: inherit; font-size: 13.5px; font-weight: 800; flex-shrink: 0;">Call 999</button>
    </div>

    <div>
      <div class="ss-label">Report an issue</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <button type="button" class="ss-report">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Safety concern
        </button>
        <button type="button" class="ss-report">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C97B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
          False alert
        </button>
        <button type="button" class="ss-report">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C97B84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          User behavior
        </button>
        <button type="button" class="ss-report">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B7969E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Something else
        </button>
      </div>
    </div>

    <div>
      <div class="ss-label">Before you respond</div>
      <div style="background: #3D2740; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; overflow: hidden;">
        <button type="button" class="ss-row">
          <span class="ss-row-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
          <span style="flex: 1; min-width: 0;">
            <span style="display: block; font-size: 14px; font-weight: 600;">Safety protocols</span>
            <span style="display: block; font-size: 12px; color: #B7969E; margin-top: 2px;">What to do and not do on a response</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B7969E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="ss-divider"></div>
        <button type="button" class="ss-row">
          <span class="ss-row-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
          <span style="flex: 1; min-width: 0;">
            <span style="display: block; font-size: 14px; font-weight: 600;">Helper handbook</span>
            <span style="display: block; font-size: 12px; color: #B7969E; margin-top: 2px;">Full guidelines and code of conduct</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B7969E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <div>
      <div class="ss-label">Contact support</div>
      <div style="background: #3D2740; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; overflow: hidden;">
        <button type="button" class="ss-row">
          <span class="ss-row-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
          <span style="flex: 1; min-width: 0;">
            <span style="display: block; font-size: 14px; font-weight: 600;">Live chat</span>
            <span style="display: block; font-size: 12px; color: #B7969E; margin-top: 2px;">9 AM – 9 PM</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B7969E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="ss-divider"></div>
        <button type="button" class="ss-row">
          <span class="ss-row-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg></span>
          <span style="flex: 1; min-width: 0;">
            <span style="display: block; font-size: 14px; font-weight: 600;">Email support</span>
            <span style="display: block; font-size: 12px; color: #B7969E; margin-top: 2px;">helper-support@sheshield.com</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B7969E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

  </div>

  <a href="HelperResponse.dc.html" style="flex-shrink: 0; height: 50px; padding: 0 22px; display: flex; align-items: center; gap: 10px; background: #3D2740; border-top: 1px solid rgba(201,123,132,0.45); text-decoration: none; color: #FBF4F5;">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #C97B84; flex-shrink: 0;"></span>
    <span style="flex: 1; min-width: 0; font-size: 13px;"><span style="font-weight: 700;">Responding to Fatima</span> <span style="color: #B7969E;">&middot; ETA 4 min</span></span>
    <span style="font-size: 13px; font-weight: 800; color: #C97B84;">Resume</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C97B84" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </a>

  <div style="flex-shrink: 0; height: 78px; background: #241720; border-top: 1px solid rgba(255,255,255,0.08); display: flex;">
    <a href="HelperHome.dc.html" class="ss-nav-item" style="color: #B7969E;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Alerts</span>
    </a>
    <a href="HelperActivity.dc.html" class="ss-nav-item" style="color: #B7969E;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Activity</span>
    </a>
    <a href="HelperSafety.dc.html" class="ss-nav-item" style="color: #C97B84;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Safety</span>
    </a>
    <a href="Profile.dc.html" class="ss-nav-item" style="color: #B7969E;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Profile</span>
    </a>
  </div>
</div>
</x-dc>
